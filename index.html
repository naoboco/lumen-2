<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN Academy — Réalité augmentée pour l'albinisme &amp; la basse vision</title>
<style>
:root {
  --bg: #0b0d16;
  --surface: #141827;
  --surface2: #1b2033;
  --surface3: #242b42;
  --border: #2e3752;
  --text: #eceef6;
  --muted: #8b94ad;
  --gold: #f6c453;
  --cyan: #56c8e8;
  --green: #6fdc8c;
  --purple: #b7a4ec;
  --coral: #ff8f70;
  --red: #ef5d5d;
  --radius: 12px;
  --fs: 15px;
}
/* Mode basse vision — le projet appliqué à lui-même */
body.lowvision {
  --bg: #000000; --surface: #10131c; --surface2: #181c29; --surface3: #222738;
  --border: #4a5578; --text: #ffffff; --muted: #c3cadb; --fs: 18px;
}
body.lowvision a { text-decoration: underline; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; font-size: var(--fs); }
button { font-family: inherit; }
a { color: var(--cyan); }

/* ===== HEADER ===== */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; position: sticky; top: 0; z-index: 100; }
.hd { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { font-size: 17px; font-weight: 700; letter-spacing: .3px; white-space: nowrap; }
.logo span { color: var(--gold); }
.hd-stats { display: flex; gap: 14px; margin-left: auto; align-items: center; flex-wrap: wrap; }
.hd-stat { display: flex; align-items: center; gap: 6px; font-size: .87em; color: var(--muted); }
.hd-stat b { color: var(--text); }
.lvl-pill { background: var(--surface3); border: 1px solid var(--border); border-radius: 99px; padding: 4px 14px; font-size: .8em; font-weight: 600; color: var(--gold); }
.xp-bar { width: 120px; height: 6px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--coral)); transition: width .4s; }
.lv-toggle { background: var(--surface3); border: 1px solid var(--border); color: var(--text); border-radius: 99px; padding: 5px 14px; font-size: .8em; cursor: pointer; }
.lv-toggle.on { background: var(--gold); color: #1a1400; border-color: var(--gold); font-weight: 700; }

/* ===== NAV ===== */
nav { background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
.nav-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; padding: 0 16px; }
.nav-btn { background: none; border: none; color: var(--muted); font-size: .87em; padding: 12px 15px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; }
.nav-btn:hover { color: var(--text); }
.nav-btn.active { color: var(--gold); border-bottom-color: var(--gold); font-weight: 600; }
.nav-btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ===== LAYOUT ===== */
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 90px; }
.view { display: none; animation: fade .25s ease; }
.view.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
@media (prefers-reduced-motion: reduce) { .view, .xp-fill { animation: none; transition: none; } }
h2 { font-size: 1.35em; font-weight: 700; margin-bottom: 4px; }
h3 { font-size: 1.05em; margin-bottom: 8px; }
.sub { font-size: .88em; color: var(--muted); margin-bottom: 20px; }

/* ===== CARDS ===== */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.stat-card .num { font-size: 1.6em; font-weight: 700; color: var(--gold); }
.stat-card .lbl { font-size: .8em; color: var(--muted); }

/* ===== PHASES / MODULES ===== */
.phase { margin-bottom: 26px; }
.phase-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.phase-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.phase-title { font-weight: 700; font-size: 1.05em; }
.phase-desc { font-size: .85em; color: var(--muted); width: 100%; margin-left: 22px; }
.phase-prog { margin-left: auto; font-size: .8em; color: var(--muted); }
.mod-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; cursor: pointer; transition: border-color .15s, transform .15s; position: relative; }
.mod-card:hover { border-color: var(--gold); transform: translateY(-2px); }
.mod-card.done { border-color: var(--green); }
.mod-card.done::after { content: "✓"; position: absolute; top: 10px; right: 12px; color: var(--green); font-weight: 700; }
.mod-card.locked { opacity: .45; cursor: not-allowed; }
.mod-card.locked::after { content: "🔒"; position: absolute; top: 10px; right: 12px; font-size: .8em; }
.mod-meta { display: flex; gap: 10px; font-size: .78em; color: var(--muted); margin-top: 6px; flex-wrap: wrap; }
.mod-meta b { color: var(--gold); }
.tag { display: inline-block; background: var(--surface3); border-radius: 6px; padding: 2px 8px; font-size: .75em; color: var(--muted); margin: 2px 3px 0 0; }

/* ===== MODAL ===== */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 200; overflow-y: auto; padding: 30px 14px; }
.modal-bg.open { display: block; }
.modal { max-width: 720px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
.modal h3 { font-size: 1.25em; margin-bottom: 2px; }
.m-sec { margin-top: 18px; }
.m-sec h4 { font-size: .82em; text-transform: uppercase; letter-spacing: .8px; color: var(--gold); margin-bottom: 8px; }
.m-sec ul { padding-left: 20px; }
.m-sec li { margin-bottom: 6px; font-size: .93em; }
.res-item { display: flex; gap: 8px; align-items: baseline; padding: 8px 10px; background: var(--surface2); border-radius: 8px; margin-bottom: 6px; font-size: .9em; flex-wrap: wrap; }
.res-type { font-size: .75em; background: var(--surface3); border-radius: 5px; padding: 1px 7px; color: var(--purple); flex: none; }
.res-free { font-size: .75em; color: var(--green); flex: none; }
.deliv { background: var(--surface2); border-left: 3px solid var(--cyan); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: .9em; }
.jarvis { background: var(--surface2); border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: .88em; font-style: italic; color: var(--muted); }
.btn { background: var(--gold); color: #1a1400; border: none; border-radius: 9px; padding: 10px 20px; font-weight: 700; cursor: pointer; font-size: .93em; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface3); color: var(--text); }
.btn.small { padding: 6px 13px; font-size: .82em; }
.modal-actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }

/* ===== PROTOTYPE ===== */
.proto-block { margin-bottom: 26px; }
.feat { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s; }
.feat:hover { border-color: var(--cyan); }
.feat.done { border-color: var(--green); }
.feat input { margin-top: 5px; accent-color: var(--green); width: 16px; height: 16px; flex: none; }
.feat .fname { font-size: .93em; }
.feat .fmeta { font-size: .77em; color: var(--muted); }
.feat .fxp { margin-left: auto; font-size: .8em; color: var(--gold); flex: none; }

/* ===== INVESTISSEURS ===== */
.inv-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.inv-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.inv-type { font-size: .72em; text-transform: uppercase; letter-spacing: .6px; border-radius: 5px; padding: 2px 8px; background: var(--surface3); color: var(--cyan); }
.inv-type.grant { color: var(--green); } .inv-type.accel { color: var(--gold); } .inv-type.assoc { color: var(--purple); } .inv-type.bench { color: var(--coral); }
.inv-desc { font-size: .88em; color: var(--muted); }
.inv-why { font-size: .86em; }
.inv-foot { display: flex; gap: 8px; align-items: center; margin-top: auto; flex-wrap: wrap; }
.inv-foot select { background: var(--surface3); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-size: .82em; }
.inv-note { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 7px 10px; font-size: .85em; font-family: inherit; resize: vertical; min-height: 34px; }
.verify { font-size: .75em; color: var(--muted); }

/* ===== BUSINESS ===== */
.biz-step { display: flex; gap: 14px; margin-bottom: 16px; }
.biz-num { width: 34px; height: 34px; border-radius: 50%; background: var(--surface3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--gold); flex: none; }
.biz-body { flex: 1; }

/* ===== BADGES ===== */
.badge { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; opacity: .35; }
.badge.won { opacity: 1; border-color: var(--gold); }
.badge .ico { font-size: 1.9em; }
.badge .bt { font-weight: 700; font-size: .9em; margin-top: 6px; }
.badge .bd { font-size: .78em; color: var(--muted); }

/* ===== JOURNAL ===== */
.lab-form { display: flex; gap: 8px; margin-bottom: 16px; }
.lab-form input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 9px; color: var(--text); padding: 10px 12px; font-size: .92em; font-family: inherit; }
.lab-entry { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; margin-bottom: 8px; display: flex; gap: 10px; align-items: baseline; }
.lab-date { font-size: .77em; color: var(--muted); flex: none; }
.lab-del { margin-left: auto; background: none; border: none; color: var(--red); cursor: pointer; font-size: .85em; }

/* ===== TOAST ===== */
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface3); border: 1px solid var(--gold); color: var(--text); padding: 11px 22px; border-radius: 99px; font-size: .9em; transition: transform .3s; z-index: 300; }
#toast.show { transform: translateX(-50%) translateY(0); }
.warn { background: var(--surface2); border-left: 3px solid var(--coral); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: .86em; color: var(--muted); margin: 14px 0; }


/* ===== FEED SCIENCES & CODE ===== */
.feed-wrap { max-width: 620px; margin: 0 auto; }
.feed-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:12px; }
.feed-hero .sub { margin:0; }
.feed-score { white-space:nowrap; background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:7px 12px; font-size:.78em; color:var(--muted); }
.feed-score b { color:var(--gold); }
.feed-filters { display:flex; gap:7px; overflow-x:auto; padding:4px 1px 12px; scrollbar-width:none; }
.feed-filters::-webkit-scrollbar, .feed-list::-webkit-scrollbar { display:none; }
.feed-picker { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:9px; margin:2px 0 12px; }
.feed-picker label { display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:7px 10px; color:var(--muted); font-size:.8em; }
.feed-picker select { min-width:0; width:100%; background:transparent; color:var(--text); border:0; outline:0; font:700 1em inherit; }
.feed-picker select option { background:var(--surface2); color:var(--text); }
.feed-shuffle { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:13px; padding:8px 13px; cursor:pointer; font-weight:700; white-space:nowrap; }
.feed-shuffle:active { transform:scale(.97); }
@media (max-width:520px) { .feed-picker { grid-template-columns:1fr; } .feed-shuffle { width:100%; } }

.feed-chip { border:1px solid var(--border); background:var(--surface); color:var(--muted); border-radius:99px; padding:7px 12px; cursor:pointer; white-space:nowrap; font-size:.8em; }
.feed-chip.active { background:var(--text); border-color:var(--text); color:var(--bg); font-weight:700; }
.feed-list { height:calc(100vh - 245px); min-height:520px; overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain; border-radius:18px; }
.feed-post { min-height:100%; scroll-snap-align:start; scroll-snap-stop:always; padding:6px 3px 14px; display:flex; }
.feed-card { position:relative; width:100%; min-height:calc(100vh - 270px); min-height:510px; border-radius:22px; overflow:hidden; border:1px solid rgba(255,255,255,.13); background:#111522; box-shadow:0 22px 55px rgba(0,0,0,.28); cursor:pointer; isolation:isolate; }
.feed-card::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.22)); pointer-events:none; z-index:2; }
.feed-progress { position:absolute; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,.15); z-index:8; }
.feed-progress > i { display:block; height:100%; width:100%; transform-origin:left; background:rgba(255,255,255,.9); animation:feedTimer 12s linear; }
@keyframes feedTimer { from { transform:scaleX(0); } to { transform:scaleX(1); } }
@media (prefers-reduced-motion:reduce) { .feed-progress > i { animation:none; } }
.feed-front, .feed-back { position:absolute; inset:0; padding:18px; display:flex; flex-direction:column; backface-visibility:hidden; transition:transform .55s cubic-bezier(.2,.8,.2,1), opacity .4s; }
.feed-front { transform:rotateY(0deg); opacity:1; }
.feed-back { transform:rotateY(180deg); opacity:0; background:linear-gradient(145deg,#121725,#20283d); overflow-y:auto; }
.feed-card.flipped .feed-front { transform:rotateY(-180deg); opacity:0; }
.feed-card.flipped .feed-back { transform:rotateY(0); opacity:1; }
.feed-top { display:flex; align-items:center; gap:10px; position:relative; z-index:4; }
.feed-avatar { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:1.25em; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.18); }
.feed-topic { font-weight:800; font-size:.92em; }
.feed-meta { color:rgba(255,255,255,.68); font-size:.73em; }
.feed-level { margin-left:auto; padding:4px 9px; border-radius:99px; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.18); font-size:.7em; }
.feed-visual { flex:1; min-height:250px; margin:14px 0 10px; border-radius:18px; display:grid; place-items:center; overflow:hidden; position:relative; z-index:3; background:rgba(4,7,14,.28); border:1px solid rgba(255,255,255,.12); }
.feed-visual::after { content:""; position:absolute; width:170px; height:170px; border-radius:50%; background:rgba(255,255,255,.08); filter:blur(12px); right:-40px; top:-50px; pointer-events:none; }
.feed-caption { position:relative; z-index:4; }
.feed-kicker { text-transform:uppercase; letter-spacing:1.7px; font-size:.68em; font-weight:800; opacity:.72; }
.feed-title { font-size:clamp(1.35em,5vw,2.05em); line-height:1.08; font-weight:900; margin:4px 0 7px; letter-spacing:-.4px; }
.feed-prompt { color:rgba(255,255,255,.76); font-size:.86em; }
.feed-actions { display:flex; align-items:center; gap:8px; margin-top:12px; position:relative; z-index:5; }
.feed-action { width:42px; height:42px; border-radius:13px; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.20); color:#fff; cursor:pointer; font-size:1.05em; display:grid; place-items:center; }
.feed-action.on { background:#fff; color:#111522; }
.feed-action.known.on { background:var(--green); border-color:var(--green); color:#07150b; }
.feed-action-label { color:rgba(255,255,255,.68); font-size:.72em; margin-left:2px; }
.feed-swipe { margin-left:auto; font-size:.71em; color:rgba(255,255,255,.58); }
.feed-back h3 { margin-top:12px; font-size:1.35em; }
.feed-explain { color:#d8ddec; font-size:.94em; margin:10px 0 14px; }
.feed-points { display:grid; gap:8px; }
.feed-point { padding:9px 11px; border-radius:11px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.08); font-size:.84em; }
.feed-code { width:100%; background:#090c13; border:1px solid rgba(255,255,255,.12); border-radius:13px; padding:14px; overflow:auto; font:600 .82em/1.65 ui-monospace,SFMono-Regular,Consolas,monospace; color:#d9e2f2; text-align:left; white-space:pre; box-shadow:inset 0 0 30px rgba(0,0,0,.28); }
.feed-code .kw { color:#c7a0ff; } .feed-code .fn { color:#66d9ef; } .feed-code .str { color:#a9e36d; } .feed-code .num { color:#ffb86c; } .feed-code .cm { color:#7d879d; font-style:italic; }
.feed-mini-code { font:700 clamp(.78em,2.3vw,.95em)/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; padding:18px; width:92%; border-radius:16px; background:rgba(3,5,10,.78); box-shadow:0 16px 32px rgba(0,0,0,.25); text-align:left; white-space:pre-wrap; }
.feed-svg { width:94%; height:94%; max-height:320px; }
.feed-empty { height:70vh; display:grid; place-items:center; text-align:center; color:var(--muted); background:var(--surface); border:1px dashed var(--border); border-radius:18px; padding:30px; }
.feed-burst { position:absolute; inset:0; z-index:20; pointer-events:none; display:grid; place-items:center; font-size:5em; opacity:0; transform:scale(.4); }
.feed-burst.go { animation:burst .65s ease; }
@keyframes burst { 0%{opacity:0;transform:scale(.4)} 35%{opacity:1;transform:scale(1.15)} 100%{opacity:0;transform:scale(1.55)} }
.feed-card[data-theme="code"] { background:linear-gradient(145deg,#172035,#1e3054 48%,#6f4db5); }
.feed-card[data-theme="web"] { background:linear-gradient(145deg,#161d32,#24456f 48%,#00a6a6); }
.feed-card[data-theme="systems"] { background:linear-gradient(145deg,#101720,#203948 48%,#2f7d65); }
.feed-card[data-theme="science"] { background:linear-gradient(145deg,#25192e,#563561 50%,#c66b49); }
.feed-card[data-theme="electric"] { background:linear-gradient(145deg,#151922,#283755 50%,#e0952d); }
.feed-counter { position:absolute; bottom:13px; right:15px; z-index:9; font-size:.68em; color:rgba(255,255,255,.48); }
@media (max-width:650px) {
  .container:has(#view-feed.active) { padding:10px 8px 74px; }
  .feed-wrap { max-width:none; }
  .feed-hero { padding:0 5px; align-items:center; }
  .feed-hero h2 { font-size:1.05em; }
  .feed-hero .sub { display:none; }
  .feed-list { height:calc(100vh - 185px); min-height:460px; }
  .feed-card { min-height:calc(100vh - 205px); border-radius:18px; }
  .feed-front, .feed-back { padding:15px; }
  .feed-title { font-size:1.48em; }
  .feed-visual { margin-top:11px; min-height:230px; }
}

</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="logo">LUMEN<span> Academy</span> · RA basse vision</div>
    <div class="hd-stats">
      <span class="lvl-pill" id="hd-level">Niveau 1</span>
      <div class="hd-stat"><b id="hd-xp">0</b> XP <div class="xp-bar"><div class="xp-fill" id="hd-xpfill"></div></div></div>
      <div class="hd-stat">🔥 <b id="hd-streak">0</b> j</div>
      <button class="lv-toggle" id="lv-toggle" onclick="toggleLowVision()" aria-pressed="false">👁 Mode basse vision</button>
    </div>
  </div>
</header>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-view="dashboard">Tableau de bord</button>
    <button class="nav-btn" data-view="feed">Feed</button>
    <button class="nav-btn" data-view="roadmap">Parcours</button>
    <button class="nav-btn" data-view="proto">Prototype</button>
    <button class="nav-btn" data-view="library">Bibliothèque</button>
    <button class="nav-btn" data-view="biz">Business</button>
    <button class="nav-btn" data-view="invest">Investisseurs</button>
    <button class="nav-btn" data-view="badges">Succès</button>
    <button class="nav-btn" data-view="lab">Journal</button>
  </div>
</nav>

<div class="container">
  <div class="view active" id="view-dashboard"></div>
  <div class="view" id="view-feed"></div>
  <div class="view" id="view-roadmap"></div>
  <div class="view" id="view-proto"></div>
  <div class="view" id="view-library"></div>
  <div class="view" id="view-biz"></div>
  <div class="view" id="view-invest"></div>
  <div class="view" id="view-badges"></div>
  <div class="view" id="view-lab"></div>
</div>

<div class="modal-bg" id="modal-bg" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div id="toast" aria-live="polite"></div>

<script>
/* =====================================================
   STOCKAGE — localStorage si dispo (fichier ouvert en
   local), sinon mémoire de session (aperçu).
===================================================== */
const store = {
  ok: (() => { try { localStorage.setItem("_t","1"); localStorage.removeItem("_t"); return true; } catch(e) { return false; } })(),
  mem: null,
  get() { if (this.ok) { try { return JSON.parse(localStorage.getItem("lumen-academy") || "null"); } catch(e) { return null; } } return this.mem; },
  set(v) { if (this.ok) { try { localStorage.setItem("lumen-academy", JSON.stringify(v)); } catch(e) {} } this.mem = v; }
};

éré.","Le résultat peut conserver exactement T.","Ajoute extends pour poser une contrainte."],"code":"function first<T>(items:T[]):T|undefined { return items[0]; }"},{"id":"ts-narrowing","group":"Web","theme":"web","icon":"TS","topic":"TypeScript","level":"Sécurité","title":"Le narrowing précise un type","kicker":"typeof et in","prompt":"Le compilateur devient utile dès qu'on lui donne des preuves. Comme tout bon analyste.","explain":"Une condition comme typeof réduit un type union dans le bloc où la condition est vraie.","points":["typeof pour les primitives.","in pour tester une propriété.","Un discriminant simplifie les unions d'objets."],"code":"if (typeof value === 'string') value.toUpperCase();"},{"id":"ts-utility","group":"Web","theme":"web","icon":"TS","topic":"TypeScript","level":"Types","title":"Les utility types transforment un type","kicker":"Partial, Pick, Omit","prompt":"Réécrire la même interface trois fois serait trop simple, donc parfaitement humain.","explain":"Partial, Pick, Omit et Record permettent de dériver de nouveaux types à partir d'un type existant.","points":["Partial rend les propriétés optionnelles.","Pick garde certaines clés.","Omit retire certaines clés."],"code":"type UserPatch = Partial<User>;"},{"id":"async-all","group":"Web","theme":"web","icon":"⏳","topic":"Async","level":"Promesses","title":"Promise.all lance en parallèle","kicker":"Temps gagné","prompt":"Attendre trois requêtes l'une après l'autre est une forme subtile d'auto-sabotage.","explain":"Promise.all attend plusieurs promesses lancées ensemble et renvoie leurs résultats dans le même ordre.","points":["Parfait pour des tâches indépendantes.","Rejette dès qu'une promesse rejette.","allSettled conserve tous les résultats."],"code":"const [user,posts]=await Promise.all([getUser(),getPosts()]);"},{"id":"async-abort","group":"Web","theme":"web","icon":"⏳","topic":"Async","level":"Réseau","title":"AbortController annule une requête","kicker":"Contrôle","prompt":"Une recherch aces pour comprendre l'état et les erreurs d'un système réel.","points":["Logue le contexte utile, pas les secrets.","Surveille latence et taux d'erreur.","Crée des alertes actionnables."],"code":"logger.error('fetch_failed',{status,requestId});"},{"id":"circuit-parallel","group":"Sciences","theme":"electric","icon":"⚡","topic":"Circuit électrique","level":"Électricité","title":"En parallèle, la tension est identique","kicker":"Plusieurs chemins","prompt":"Le courant se partage. La tension, elle, reste remarquablement constante.","explain":"Dans des branches en parallèle, chaque branche reçoit la même tension tandis que le courant total est la somme des courants de branche.","points":["U1 = U2 = Ugénérateur.","Itotal = I1 + I2.","La résistance équivalente diminue."],"code":"1 / R_eq = 1/R1 + 1/R2"},{"id":"circuit-kirchhoff","group":"Sciences","theme":"electric","icon":"⚡","topic":"Circuit électrique","level":"Analyse","title":"Kirchhoff conserve courant et énergie","kicker":"Nœuds et mailles","prompt":"Les électrons n'apparaissent pas spontanément au carrefour. C'est rassurant.","explain":"La loi des nœuds impose que les courants entrants égalent les courants sortants. La loi des mailles impose que la somme des tensions d'une boucle soit nulle.","points":["ΣI entrant = ΣI sortant.","ΣU dans une maille = 0.","Choisis des sens arbitraires puis respecte les signes."],"code":"I1 = I2 + I3"},{"id":"circuit-capacitor","group":"Sciences","theme":"electric","icon":"⚡","topic":"Circuit électrique","level":"Composants","title":"Un condensateur stocke de la charge","kicker":"C = Q / U","prompt":"Une petite réserve d'énergie, pas une batterie miniature. Nuance précieuse.","explain":"Un condensateur accumule des charges opposées sur deux armatures et s'oppose aux variations rapides de tension.","points":["Capacité en farads.","En continu, il se charge puis bloque le courant idéalement.","Utilisé pour filtrage et temporisation."],"code":"tau = R * C"},{"id":"physics-energy","grou const LEVELS_XP = [0, 300, 800, 1500, 2500, 4000, 6000];

let state = store.get() || { xp:0, done:[], feats:[], inv:{}, lab:[], streak:0, lastDay:null, badges:[], lowvision:false, feedKnown:[], feedSaved:[], feedLikes:[], feedTopic:"Mix", feedOrder:[], feedVersion:0 };
state.feedKnown = state.feedKnown || []; state.feedSaved = state.feedSaved || []; state.feedLikes = state.feedLikes || []; state.feedTopic = state.feedTopic || "Mix"; state.feedOrder = Array.isArray(state.feedOrder) ? state.feedOrder : []; state.feedVersion = state.feedVersion || 0;
function save() { store.set(state); }

function updateStreak() {
  const today = new Date().toDateString();
  if (state.lastDay === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  state.streak = (state.lastDay === y.toDateString()) ? state.streak + 1 : 1;
  state.lastDay = today; save();
}

function userLevel() {
  let lv = 0;
  for (let i = 0; i < LEVELS_XP.length; i++) if (state.xp >= LEVELS_XP[i]) lv = i;
  return lv;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

function toggleLowVision() {

}
function applyLowVision() {

function phaseUnlocked(pid) {
  if (pid === 0) return true;
  const prev = MODULES.filter(m => m.phase === pid - 1);
  return prev.filter(m => state.done.includes(m.id)).length >= Math.ceil(prev.length / 2);
}
function renderRoadmap() {
  const v = document.getElementById("view-roadmap");
  let html = `<h2>Parcours d'apprentissage</h2>
  <p class="sub">9 phases, ${MODULES.length} modules, ressources 100 % gratuites. Une phase se débloque quand la moitié de la précédente est terminée — la rigueur avant l'enthousiasme.</p>`;
  PHASES.forEach(ph => {
    const mods = MODULES.filter(m => m.phase === ph.id);
    const done = mods.filter(m => state.done.includes(m.id)).length;
    const unlocked = phaseUnlocked(ph.id);
    html += `<div class="phase">
      <div class="phase-head">
        <span class="phase-dot" style="background:${ph.color}"></span>
        <span class="phase-title">${ph.name}</span>

      </div>
      <div class="grid">
        ${mods.map(m => `
          <div class="mod-card ${state.done.includes(m.id) ? "done" : ""} ${unlocked ? "" : "locked"}"
               ${unlocked ? `onclick="openModule('${m.id}')" tabindex="0" onkeydown="if(event.key==='Enter')openModule('${m.id}')"` : ""}>
            <div style="font-weight:700;">${m.title}</div>
            <div style="font-size:.85em; color:var(--muted); margin-top:4px;">${m.desc}</div>
            <div class="mod-meta"><span>⏱ ${m.time}</span><span><b>+${m.xp} XP</b></span><span>${m.res.length} ressources</span></div>
          </div>`).join("")}
      </div>
    </div>`;
  });
  v.innerHTML = html;
}

function openModule(id) {
  const m = MODULES.find(x => x.id === id);
  const done = state.done.includes(id);
  const modal = document.getElementById("modal");
  modal.innerHTML = `
    <h3>${m.title}</h3>
    <div style="font-size:.85em; color:var(--muted);">⏱ ${m.time} · +${m.xp} XP</div>

    <div class="modal-actions">
      ${done
        ? `<button class="btn ghost" onclick="unmarkModule('${m.id}')">Marquer non terminé</button>`

function completeModule(id) {
  if (state.done.includes(id)) return;

function unmarkModule(id) {
  const m = MODULES.find(x => x.id === id);

const FEED_VERSION = 3;
function ensureFeedOrder() {
  const ids = FEED_POSTS.map(p => p.id);
  const invalid = state.feedVersion !== FEED_VERSION || state.feedOrder.length !== ids.length || ids.some(id => !state.feedOrder.includes(id));
  if (invalid) {
    state.feedOrder = ids.slice();
    for (let i = state.feedOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.feedOrder[i], state.feedOrder[j]] = [state.feedOrder[j], state.feedOrder[i]];
    }
    state.feedVersion = FEED_VERSION;
    save();
  }
}
function getVisibleFeedPosts() {
  ensureFeedOrder();
  let posts = FEED_POSTS.filter(p => {
    if (state.feedTopic === "Mix") return true;
    if (state.feedTopic === "Sauvegardés") return state.feedSaved.includes(p.id);
    return p.topic === state.feedTopic;
  });
  const rank = new Map(state.feedOrder.map((id, i) => [id, i]));
  return posts.sort((a, b) => (rank.get(a.id) ?? 9999) - (rank.get(b.id) ?? 9999));
}
function renderFeed() {
  const v = document.getElementById("view-feed");
  const topics = ["Mix", ...new Set(FEED_POSTS.map(p => p.topic)), "Sauvegardés"];
  const posts = getVisibleFeedPosts();
  const themeLabel = state.feedTopic === "Mix" ? "Mix de toutes les matières" : state.feedTopic;
  v.innerHTML = `<div class="feed-wrap">
    <div class="feed-hero">
      <div><h2>Feed · Code &amp; Sciences</h2><p class="sub">Choisis une matière ou lance le Mix. Tap pour apprendre · double-tap pour maîtriser.</p></div>
      <div class="feed-score"><b>${state.feedKnown.length}</b> maîtrisés · ${FEED_POSTS.length} cartes</div>
    </div>
    <div class="feed-picker">
      <label><span>Thème</span><select onchange="setFeedTopic(this.value)" aria-label="Choisir le thème du feed">
        ${topics.map(t => `<option value="${t}" ${state.feedTopic===t?"selected":""}>${t === "Mix" ? "🔀 Mix de tous les thèmes" : t === "Sauvegardés" ? "🔖 Cartes sauvegardées" : t}</option>`).join("")}
      </select></label>
      <button class="feed-shuffle" onclick="shuffleFeed()">🔀 Mélanger ${state.feedTopic === "Mix" ? "le feed" : themeLabel}</button>
    </div>
    <div class="feed-filters" aria-label="Raccourcis de thèmes">
      ${["Mix","C++","Python","JavaScript","React","Circuit électrique","Physique","Chimie"].map(t=>`<button class="feed-chip ${state.feedTopic===t?"active":""}" onclick="setFeedTopic('${t}')">${t}</button>`).join("")}
    </div>
    <div class="feed-list" id="feed-list">
      ${posts.length ? posts.map((p,i)=>feedPostHTML(p,i,posts.length)).join("") : `<div class="feed-empty"><div><div style="font-size:2.5em">🔖</div><b>Aucune carte ici</b><br>Choisis un autre thème ou sauvegarde quelques leçons.</div></div>`}
    </div>
  </div>`;
}
function setFeedTopic(topic) {
  state.feedTopic = topic;
  save();
  renderFeed();
}
function shuffleFeed() {
  ensureFeedOrder();
  const visibleIds = getVisibleFeedPosts().map(p => p.id);
  const shuffled = visibleIds.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const visibleSet = new Set(visibleIds);
  let k = 0;
  state.feedOrder = state.feedOrder.map(id => visibleSet.has(id) ? shuffled[k++] : id);
  save();
  renderFeed();
  toast(`Feed mélangé · ${visibleIds.length} cartes.`);
}
function feedPostHTML(p, index, total) {
  const liked = state.feedLikes.includes(p.id), saved = state.feedSaved.includes(p.id), known = state.feedKnown.includes(p.id);
  return `<article class="feed-post">

        <div class="feed-actions">
          <button class="feed-action ${liked?'on':''}" onclick="event.stopPropagation(); likeFeed('${p.id}')" aria-label="J'aime">${liked?'♥':'♡'}</button>
          <button class="feed-action ${saved?'on':''}" onclick="event.stopPropagation(); saveFeed('${p.id}')" aria-label="Sauvegarder">${saved?'▮':'▯'}</button>
          <button class="feed-action known ${known?'on':''}" onclick="event.stopPropagation(); masterFeed('${p.id}', event)" aria-label="Marquer maîtrisé">${known?'✓':'○'}</button>
          <span class="feed-action-label">${known?'Maîtrisé':'À apprendre'}</span><span class="feed-swipe">Tap pour retourner ↑</span>
        </div>
      </section>
      <section class="feed-back">
        <div class="feed-top"><div class="feed-avatar">${p.icon}</div><div><div class="feed-topic">Explication · ${p.topic}</div><div class="feed-meta">retape pour revenir</div></div><span class="feed-level">${p.level}</span></div>
        <h3>${p.title}</h3><div class="feed-explain">${p.explain}</div>
        <div class="feed-points">${p.points.map(x=>`<div class="feed-point">◆ ${x}</div>`).join("")}</div>
        <div style="margin-top:14px"><div class="feed-kicker" style="margin-bottom:7px">À retenir</div><div class="feed-code">${escapeFeedCode(p.code)}</div></div>
        <div class="feed-actions" style="margin-top:auto;padding-top:14px">
          <button class="feed-action known ${known?'on':''}" onclick="event.stopPropagation(); masterFeed('${p.id}', event)">${known?'✓':'○'}</button><span class="feed-action-label">${known?'Concept maîtrisé':'Marquer maîtrisé'}</span><span class="feed-swipe">Tap pour le visuel</span>
        </div>
      </section><span class="feed-counter">${index+1}/${total}</span>
    </div>
  </article>`;
}
function escapeFeedCode(code) { return code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function flipFeed(id) { document.getElementById("feed-"+id)?.classList.toggle("flipped"); }
function likeFeed(id) { state.feedLikes = state.feedLikes.includes(id) ? state.feedLikes.filter(x=>x!==id) : [...state.feedLikes,id]; save(); renderFeedKeep(id); }
function saveFeed(id) { state.feedSaved = state.feedSaved.includes(id) ? state.feedSaved.filter(x=>x!==id) : [...state.feedSaved,id]; save(); renderFeedKeep(id); toast(state.feedSaved.includes(id) ? "Leçon sauvegardée." : "Leçon retirée des sauvegardes."); }
function masterFeed(id, event) {
  if (event) { event.stopPropagation(); event.preventDefault(); }
  const adding = !state.feedKnown.includes(id);
  state.feedKnown = adding ? [...state.feedKnown,id] : state.feedKnown.filter(x=>x!==id);
  if (adding) state.xp += 15;
  else state.xp = Math.max(0,state.xp-15);
  save(); renderHeader(); renderFeedKeep(id);
  if (adding) { const b=document.getElementById("burst-"+id); if(b){b.classList.remove("go"); void b.offsetWidth; b.classList.add("go");} }
  toast(adding ? "Concept maîtrisé. +15 XP." : "Concept remis à réviser.");
}
function renderFeedKeep(id) {
  const old=document.getElementById("feed-"+id); const top=old?.parentElement?.offsetTop || 0; const flipped=old?.classList.contains("flipped");
  renderFeed(); const next=document.getElementById("feed-"+id); if(flipped) next?.classList.add("flipped"); const list=document.getElementById("feed-list"); if(list) list.scrollTop=top;
}

  <div class="grid">
  ${INVESTORS.map(inv => {
    const s = state.inv[inv.id] || { st:"todo", note:"" };
    return `<div class="inv-card">
      <div class="inv-top"><b>${inv.name}</b><span class="inv-type ${inv.cls}">${inv.type}</span></div>
      <div class="inv-desc">${inv.desc}</div>
      <div class="inv-why">💡 ${inv.why}</div>
      <div class="inv-foot">
        <a href="${inv.url}" target="_blank" rel="noopener">Site</a>
        <select onchange="setInvStatus('${inv.id}', this.value)" aria-label="Statut du contact">
          ${Object.entries(ST).map(([k,n])=>`<option value="${k}" ${s.st===k?"selected":""}>${n}</option>`).join("")}
        </select>
        <span class="verify">${inv.verified ? "✔ vérifié (sources 2016–2026)" : "⚠ à re-vérifier"}</span>
      </div>
      <textarea class="inv-note" placeholder="Notes de contact (personne, date, réponse...)" onchange="setInvNote('${inv.id}', this.value)">${s.note || ""}</textarea>
    </div>`;
  }).join("")}
  </div>`;
}
function setInvStatus(id, st) {
  state.inv[id] = state.inv[id] || {}; state.inv[id].st = st; save(); checkBadges(); renderDashboard(); renderBadges();
  if (st === "contact") toast("Premier contact enregistré. Voilà qui devient sérieux.");
}
function setInvNote(id, note) { state.inv[id] = state.inv[id] || { st:"todo" }; state.inv[id].note = note; save(); }

/* =====================================================
   BADGES
===================================================== */
function checkBadges() {
  BADGES.forEach(b => {
    if (!state.badges.includes(b.id) && b.test(state)) {
      state.badges.push(b.id); save();
      toast(`Succès débloqué : ${b.ico} ${b.t}`);
    }
  });
}
function renderBadges() {
  const v = document.getElementById("view-badges");
  v.innerHTML = `<h2>Succès</h2><p class="sub">${state.badges.length}/${BADGES.length} débloqués. La gamification fonctionne même quand on sait qu'elle fonctionne. Fascinant.</p>
  <div class="grid">${BADGES.map(b=>`
    <div class="badge ${state.badges.includes(b.id) ? "won" : ""}">
      <div class="ico">${b.ico}</div><div class="bt">${b.t}</div><div class="bd">${b.d}</div>
    </div>`).join("")}</div>`;
}

/* =====================================================
   JOURNAL
===================================================== */
function renderLab() {
  const v = document.getElementById("view-lab");
  v.innerHTML = `<h2>Journal de bord</h2>
  <p class="sub">Avancées, blocages, idées, retours d'utilisateurs. Un projet de 10 ans sans journal est un projet de 10 ans d'amnésie.</p>
  <div class="lab-form">
    <input id="lab-input" placeholder="Ex : OCR hébreu fonctionne à 80% — tester avec l'éclairage de la salle de classe" onkeydown="if(event.key==='Enter')addLabEntry()">
    <button class="btn" onclick="addLabEntry()">Ajouter</button>
  </div>
  ${[...state.lab].reverse().map((e,ri)=>{
    const i = state.lab.length - 1 - ri;
    return `<div class="lab-entry"><span class="lab-date">${e.d}</span><span style="font-size:.92em;">${e.t}</span><button class="lab-del" onclick="delLabEntry(${i})" aria-label="Supprimer">✕</button></div>`;
  }).join("") || `<div class="card" style="text-align:center; color:var(--muted); font-size:.9em;">Aucune entrée. Le silence est élégant mais peu documenté.</div>`}
  <div class="modal-actions">
    <button class="btn ghost small" onclick="exportData()">Exporter la progression (JSON)</button>
    <button class="btn ghost small" onclick="document.getElementById('import-file').click()">Importer</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)">
  </div>
  ${store.ok ? "" : `<div class="warn">Aperçu sans sauvegarde persistante : téléchargez le fichier et ouvrez-le dans votre navigateur pour que la progression soit conservée (ou utilisez Exporter/Importer).</div>`}`;
}
function addLabEntry() {
  const inp = document.getElementById("lab-input");
  const t = inp.value.trim(); if (!t) return;
  state.lab.push({ d: new Date().toLocaleDateString("fr-FR"), t }); save(); renderLab();
}
function delLabEntry(i) { state.lab.splice(i, 1); save(); renderLab(); }

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "lumen-progression.json"; a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { state = JSON.parse(r.result); state.feedKnown=state.feedKnown||[]; state.feedSaved=state.feedSaved||[]; state.feedLikes=state.feedLikes||[]; state.feedTopic=state.feedTopic||"Mix"; state.feedOrder=Array.isArray(state.feedOrder)?state.feedOrder:[]; state.feedVersion=state.feedVersion||0; save(); applyLowVision(); renderAll(); toast("Progression importée."); } catch(e) { toast("Fichier invalide."); } };
  r.readAsText(f);
}

/* =====================================================
   NAVIGATION & INIT
===================================================== */
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("view-" + btn.dataset.view).classList.add("active");
  });
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function renderAll() {
  renderHeader(); renderDashboard(); renderFeed(); renderRoadmap(); renderProto();
  renderLibrary(); renderBiz(); renderInvest(); renderBadges(); renderLab();
}
updateStreak(); applyLowVision(); checkBadges(); renderAll();

</script>
</body>
</html>
